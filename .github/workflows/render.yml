name: Render Remotion Video
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate AI Voiceover
        run: |
          pip install edge-tts
          mkdir -p public
          edge-tts --voice hi-IN-MadhurNeural --text "Kya aap abhi bhi manual kaam mein uljhe hain? Slow replies aur missed calls se rozana clients ka nuksan hota hai. Miliye Prince se aur AutoBuildX AI ke saath apne business ka 80 percent kaam automate karein. Shuru karne ke liye abhi DM karein AUTO!" --write-media public/voice.mp3

      - name: Render Video
        run: npx remotion render src/index.ts MyVideo out/video.mp4

      - name: Upload MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/video.mp4
          
